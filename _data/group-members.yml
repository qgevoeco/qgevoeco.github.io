    - name: Molly Folkerts Caldwell
      role: Ph.D.
      start-date: 2019
      end-date: 2026
      current-position: Lecturer at Auburn University
      avatar: circle_CaldwellMolly.png
      coadvisor: Dan Warner
      coadvisor-url: https://warnerlab.weebly.com/
      bio: > 
           Molly received a Bachelor of Science in Zoology from Auburn University in 2012 and went on to complete a Master’s degree in Field and Organismal Biology from Louisiana State University in Shreveport. Her Master's thesis research was on variation in Green Heron nesting success in coastal marshes of southwest Louisiana. After finishing her Master's, she worked for over 3 years in coastal bird monitoring and conservation with Audubon Mississippi Coastal Bird Stewardship Program (National Audubon Society), protecting beach-nesting bird species such as the Least Tern and Black Skimmer. Though she has spent much of her career studying avian ecology, Molly has always loved herps and studied yellow-bellied slider ecology for her Ph.D. She is now a lecturer at Auburn University. Molly's general interests are in conservation, reproductive biology, ecology, and evolution. Her ultimate goal is to pursue a career in which she can work to conserve imperiled species of the southeastern US.

    - name: Iwo Gross
      role: Ph.D.
      start-date: 2018
      end-date: 2025
      current-position: Postdoc at the University of Alberta
      avatar: circle_GrossIwo.png
      github: iwogross
      bio: > 
           Iwo’s baccalaureate and master’s work investigated the space-use patterns of diminutive snake species and newborn pit-vipers with respect to road ecology and forest management practices. As a Ph.D. student, Iwo assessed how natural, sexual, and anthropogenic pressures within an ecosystem shape turtle demographics and life-history evolution. Iwo now holds a postdoctoral position in the Nakagawa COSSEE lab at the University of Alberta. In his free time, Iwo practices jiu-jitsu and judo, and enjoys recreational surveys for amphibians and reptiles.

    - name: Logan Havard
      role: M.Sc.
      start-date: 2023
      end-date: 2025
      current-position: Ph.D. student at Mississippi State University
      avatar: circle_HavardLogan.png
      github: loganghavard
      coadvisor: Laurie Stevison
      coadvisor-url: https://sites.google.com/site/lstevison/
      bio: > 
           Logan received his Bachelor of Science in Biology and Mathematics from William Carey University in Hattiesburg, MS, in 2021. He taught high school math and science in his hometown of Lucedale, MS, for two years before starting his master’s work at Auburn. While Logan enjoyed his time as a high school educator, he decided to deepen his knowledge and passion for science by pursuing research. He is broadly interested in evolutionary genetics, conservation, and bioinformatics. As part of his master’s thesis, Logan developed a recombination map of the Mississippi diamond-backed terrapin (Malaclemys terrapin pileata) to understand how genetic variation is maintained in turtle populations. He is now pursuing a Ph.D. in the Dapper Lab at Mississippi State University.


    - name: Sam Weaver
      role: Postdoctoral Researcher
      start-date: 2022
      end-date: 2023
      current-position: Private Industry
      bio: >
           During his PhD at the University of Minnesota, Sam explored how climate interacts with processes that generate and maintain biodiversity in salamanders and mud turtles. He is thrilled to work with the Wolak and Schwartz labs to develop genomic resources and conduct population genetic analyses of diamond-backed terrapins, with the goal of quantifying patterns of dispersal and environmental selection in this ecologically distinct species. When not sitting on his computer, Sam enjoys fly fishing, biking, and birding.
      avatar: circle_WeaverSam.png
      github: sbw0033
      coadvisor: Tonia Schwartz
      coadvisor-url: https://www.schwartzlab-ecoevolutionarygenomics.org/


