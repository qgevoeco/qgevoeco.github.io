  - title: Honorary Members
    members:

    - name: Justin Jenkins
      role: NSF-REU
      start-date: May 2022
      end-date: July 2022
      current-position: Ph.D. student at U. Texas A&M, Galveston
      avatar: circle_JenkinsJustin.png
      bio: > 
           Justin was an undergraduate student at the University of Miami earning a B.S. in Marine Biology and Ecology who participated in a REU at Auburn University. Justin has now moved onto a Ph.D. program at the University of Texas A&M, Galveston. He has always had a passion for turtles and the marine environment and with us he studied the behavior of aquatic turtles in Alabama. He now conducts reasearch on sea turtle foraging ecology with the goal of eventually pursuing a career in sea turtle conservation. Throughout his career, he hopes to promote diversity in the field of science and the protection of our natural environment.  



