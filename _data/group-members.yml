    - name: Kirby Merlo
      role: M.Sc. student
      start-date: 2026
      avatar:
      bio: >
           Kirby will investigate behavioral variation in our laboratory seed beetle (Callosobruchus maculatus) populations.

    - name: McKae Sarkowski
      role: M.Sc. student
      start-date: 2025
      avatar: circle_McKaeSarkowski2026.png
      bio: > 
           My research in evolutionary ecology focuses on how selection and life history processes shape phenotypic variation across development, particularly in relation to sexual dimorphism. I am interested in applying integrative and quantitative approaches to understand how traits evolve and diverge within natural populations, and how this insight can inform conservation and management decisions.
           

    - name: Olivia Brown
      role: M.Sc. student
      start-date: 2025
      avatar: circle_BrownOlivia.png
      bio: >
           Olivia received a Bachelor of Science in Wildlife Ecology and Management from Auburn University in 2022. Olivia's general interests are in ecology, evolution, and conservation. During her undergraduate career, Olivia developed and executed a research project studying boldness behavior of semi-aquatic freshwater turtles. As a Master's student, Olivia hopes to contribute to our growing understanding of ecology and evolution as well as encourage an inclusive and productive lab environment for every member.
           
